name: beacon
port: 8081
workers: 2
limits:
  retries: 1
  timeout: 5s
managed:
  owner: platform
  reload: graceful
rate_limit:
  requests_per_second: 100
  burst: 200
upstream_pool:
  name: edge
  members:
    - host: atlas
      port: 8080
    - host: beacon
      port: 8081
    - host: echo
      port: 8082
metrics:
  endpoint: /metrics
  scrape_interval: 30s
