name: echo
port: 8082
workers: 8
exemptions:
  ratelimit: true
limits:
  retries: 1
  timeout: 5s
managed:
  owner: platform
  reload: graceful
tuning:
  connection_pool: 512
upstream_pool:
  name: edge
  members:
    - host: atlas
      port: 8080
    - host: beacon
      port: 8081
    - host: echo
      port: 8082
metrics:
  endpoint: /metrics
  scrape_interval: 60s
