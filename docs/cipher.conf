name: cipher
port: 9000
workers: 2
limits:
  retries: 1
  timeout: 30s
managed:
  owner: platform
  reload: graceful
upstream_pool:
  name: internal
  members:
    - host: cipher
      port: 9000
    - host: delta
      port: 9000
tls:
  certificate: /etc/certs/cipher.pem
  certificate_key: /etc/certs/cipher.key
  min_version: TLSv1.2
