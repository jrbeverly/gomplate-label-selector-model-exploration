name: atlas
port: 8080
workers: 4
limits:
  retries: 1
  timeout: 5s
managed:
  owner: platform
  reload: graceful
routes:
  - target: atlas-canary
    weight: 10
  - target: atlas-stable
    weight: 90
rate_limit:
  requests_per_second: 100
  burst: 200
upstream_pool:
  name: edge
  members:
    - host: atlas
      port: 8080
    - host: beacon
      port: 8081
    - host: echo
      port: 8082
metrics:
  endpoint: /healthz/metrics
  scrape_interval: 15s
tls:
  certificate: /etc/certs/atlas.pem
  certificate_key: /etc/certs/atlas.key
  min_version: TLSv1.3
